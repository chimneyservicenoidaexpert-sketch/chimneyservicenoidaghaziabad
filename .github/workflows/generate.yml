name: Generate 60 Pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: node generate.js
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add.
          git commit -m "auto generate 60 unique pages" || echo "no changes"
          git push
